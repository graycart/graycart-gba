# Credits: adapted from graycart-gb `.github/ISSUE_TEMPLATE/feature.yml`
name: Feature request
description: Propose a new capability or UX improvement (title + description only).
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are **title + description only** for v1.
        Use a [Bug report](./bug.yml) for incorrect emulation, crashes, or host failures.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What you want and why it helps. Keep it concrete; no diagnostic dump required.
      placeholder: |
        I want …
        so that …
    validations:
      required: true

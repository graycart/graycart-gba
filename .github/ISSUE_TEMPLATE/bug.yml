# Credits: adapted from graycart-gb `.github/ISSUE_TEMPLATE/bug.yml`
# Retargeted for GBA (+ optional DMG/CGB compat path).
name: Bug report
description: Report incorrect emulation, a crash, or host/UI failure in Graycart GBA.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Fill every field you can.

        Do **not** attach commercial ROMs, `.sav` / `.gcs*` files, or Nintendo BIOS / boot firmware.
        ROM **title/header** and basename only; scrub username-bearing paths.

  - type: input
    id: version
    attributes:
      label: Graycart GBA version
      description: Product version from the window title, About dialog, or `Cargo.toml` (e.g. `0.1.0`).
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit / SHA
      description: Git commit if known (`git rev-parse HEAD`, or release build metadata). Use `unknown` for opaque release builds.
      placeholder: "abc1234 or unknown"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      description: Host OS and arch (e.g. `Windows 11 x86_64`, `macOS 15 arm64`, `Ubuntu 24.04 x86_64`).
      placeholder: "OS version + arch"
    validations:
      required: true

  - type: input
    id: rom_title
    attributes:
      label: ROM title / header
      description: Cartridge title from the ROM header (not the full filesystem path). Basename only if that is all you have.
      placeholder: "HOMEBREW TITLE / POKEMON EMERALD"
    validations:
      required: true

  - type: dropdown
    id: cart_kind
    attributes:
      label: Cartridge kind
      description: What you launched when the bug happened.
      options:
        - Native GBA (.gba)
        - DMG / Game Boy (.gb) via compat
        - Game Boy Color (.gbc) via compat
        - Multiboot / EWRAM image
        - Unknown / not sure
    validations:
      required: true

  - type: dropdown
    id: bios_mode
    attributes:
      label: BIOS / boot mode
      description: Soft HLE vs user-supplied LLE BIOS (never attach the BIOS file).
      options:
        - BiosHle (default / soft)
        - BiosLle (user BIOS)
        - Multiboot
        - Unknown / not sure
    validations:
      required: true

  - type: input
    id: audio
    attributes:
      label: Audio backend / device
      description: Short label only (e.g. `System Default`, `WASAPI …`, `Core Audio …`, `offline`). Not a full device enumeration dump.
      placeholder: "System Default"
    validations:
      required: true

  - type: input
    id: controller
    attributes:
      label: Controller / input
      description: Keyboard defaults, remapped controls, or gamepad/backend summary if relevant.
      placeholder: "Keyboard (defaults) / gamepad name"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic capture
      description: Paste panic / fault report text, or say none. Text only — no ROM bytes, BIOS bytes, or full path dumps.
      placeholder: "Paste diagnostic text, or write `none`."
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: Expected vs actual behavior, and steps to reproduce.
      placeholder: |
        Steps:
        1. …
        Expected:
        Actual:
    validations:
      required: true

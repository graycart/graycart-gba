# Credits: adapted from graycart-gb `.github/workflows/ci.yml`
#   https://github.com/graycart/graycart-gb/blob/main/.github/workflows/ci.yml
# Policy + gates: Project store docs/graycart-gba PHASES / 08 / 11 / 12; AGENTS.md.
#
# Matrix: one job per OS (name = runner label): ubuntu-latest, macos-latest,
# windows-latest. Each runs: fmt + clippy -D warnings + cargo test.
# fail-fast: false so one OS flake does not cancel the others.
# RUST_MIN_STACK keeps deep emulator recursion from overflowing the default thread stack.
#
# Default cargo test MUST assert jsmolka arm.gba + thumb.gba + memory.gba PASS
# (BiosHle + r12/idle oracle). Never fake green.
#
# Policy: deeper ROM matrices marked `#[ignore]` (mGBA suite, NBA hw-test, full
# matrix printout) are manual / opt-in only. Do not run `cargo test -- --ignored`
# here — optional nightly/workflow_dispatch only if useful later; never
# merge-blocking until SoC-depth thresholds are agreed. Never require BIOS images.
# Windows PE/GUI-subsystem checks land with host packaging (tools/); omitted for now.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "16777216"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux audio/input libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        # Asserts jsmolka arm+thumb+memory PASS; ignored SoC-depth rows stay opt-in.
        run: cargo test
